<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15202b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Moviola">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Moviola Scacchi</title>

<style>
/* Layout: come la revisione di chess.com — scacchiera a sinistra, pannello del coach a destra; una colonna sul telefono. Tema scuro unico, voluto. */
:root {
  --bg: #302e2b; --panel: #262522; --panel2: #1f1e1b; --raise: #3c3a37; --line: #403d39;
  --ink: #ffffff; --ink2: #d6d5d4; --muted: #9a9895;
  --green: #81b64c; --green-sh: #45753c; --gray-btn: #454341; --gray-sh: #2b2927;
  --sq-l: #ebecd0; --sq-d: #739552; --last: rgba(255, 255, 51, .5); --sel: rgba(20, 85, 30, .5);
  --k-best: #81b64c; --k-excellent: #96bc4b; --k-good: #95af8a; --k-book: #a88865; --k-forced: #97af8b;
  --k-inaccuracy: #f7c631; --k-mistake: #ffa459; --k-miss: #ff7769; --k-blunder: #fa412d;
  --f: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.45; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.muted { color: var(--muted); }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 10px 40px; }

/* Barra in alto */
.top { display: flex; align-items: center; gap: 14px; justify-content: space-between; flex-wrap: wrap; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
.brand svg { width: 28px; height: 28px; color: var(--green); }
.tabs { display: flex; gap: 2px; background: var(--panel2); border-radius: 8px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); font-weight: 700; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--raise); color: var(--ink); }

/* Pulsanti come su chess.com */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; cursor: pointer; text-decoration: none; background: var(--green); color: #fff; font-weight: 800; padding: 10px 18px; border-radius: 8px; box-shadow: 0 4px 0 var(--green-sh); margin-bottom: 4px; transition: filter .1s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-sh); }
.btn:disabled { opacity: .45; cursor: default; filter: none; transform: none; }
.btn.secondary { background: var(--gray-btn); box-shadow: 0 4px 0 var(--gray-sh); color: var(--ink2); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--ink2); border: 1px solid var(--line); margin-bottom: 0; font-weight: 700; }
.btn.ghost:hover { border-color: var(--muted); }
.btn.small { padding: 7px 12px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn.big { font-size: 18px; padding: 14px 18px; }

.card { background: var(--panel); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.card-h { margin: 0; font-size: 17px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); }
.eyebrow.dark { color: var(--muted); }
.sec { font-size: 18px; margin: 0; }

/* Home */
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; max-width: 760px; margin: 0 auto; }
.userbar { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); flex: 1 1 200px; }
.field input, .field select, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
textarea { width: 100%; min-height: 120px; font-family: var(--mono); font-size: 12.5px; resize: vertical; }
.progress { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel2); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.progress span { flex: 1 1 100%; }
.prog-track { flex: 1 1 180px; height: 8px; background: var(--raise); border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; width: 0; background: var(--green); transition: width .2s; }
.err { color: var(--k-miss); margin: 0; font-size: 14px; }
#games { display: flex; flex-direction: column; gap: 6px; }
.grow { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; background: var(--panel2); border: 0; border-radius: 8px; padding: 12px 14px 12px 0; cursor: pointer; overflow: hidden; }
.grow:hover { background: var(--raise); }
.g-dot { align-self: stretch; background: var(--muted); }
.grow.won .g-dot { background: var(--green); } .grow.lost .g-dot { background: var(--k-blunder); }
.g-main { display: flex; flex-direction: column; min-width: 0; }
.g-opp { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-meta { font-size: 13px; color: var(--muted); }
.g-tag { font-size: 13px; font-weight: 800; color: var(--green); display: inline-flex; align-items: center; gap: 4px; padding-right: 4px; }
.g-tag.done { color: var(--ink2); }
details.more { background: var(--panel); border-radius: 10px; }
details.more summary { cursor: pointer; padding: 14px 16px; font-weight: 700; color: var(--ink2); }
.more-body { display: flex; flex-direction: column; gap: 10px; padding: 0 16px 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filebtn { cursor: pointer; }
.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.sidepick { display: flex; gap: 16px; font-size: 14px; }
.empty { text-align: center; align-items: center; padding: 26px 16px; background: var(--panel2); border-radius: 10px; display: flex; flex-direction: column; gap: 12px; }
.empty p { margin: 0; color: var(--ink2); max-width: 46ch; }

/* Revisione */
.rv-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.backbtn { border: 0; background: var(--panel2); color: var(--ink2); width: 40px; height: 40px; border-radius: 8px; cursor: pointer; font-size: 20px; flex: 0 0 auto; }
.rv-title { font-weight: 800; font-size: 17px; }
.rv-sub { font-size: 13px; color: var(--muted); }
.demo-note { font-size: 13px; color: var(--muted); margin: -4px 0 10px; }
.rv-grid { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 18px; align-items: start; }
.boardcol { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pbar { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; padding-left: 30px; min-height: 26px; }
.pdot { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto; }
.pdot.w { background: #fff; } .pdot.b { background: #111; border: 1px solid #666; }
.pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pclock { font-family: var(--mono); font-size: 14px; background: var(--panel2); padding: 2px 8px; border-radius: 5px; font-variant-numeric: tabular-nums; }
.pclock:empty { display: none; }
.boardwrap { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 6px; }
.evalbar { position: relative; background: #403d39; border-radius: 3px; overflow: hidden; }
.evalbar .fill { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; transition: height .25s; }
.evaltxt { position: absolute; left: 0; right: 0; bottom: 4px; font-size: 9px; font-weight: 800; text-align: center; color: #403d39; font-family: var(--mono); }
.board { aspect-ratio: 1; max-width: 100%; border-radius: 4px; overflow: hidden; touch-action: manipulation; }
.board { cursor: pointer; }
.board.exploring { box-shadow: 0 0 0 3px #5d9bd6; }
.boardnote { font-size: 13px; color: var(--ink2); background: var(--panel2); border-radius: 6px; padding: 6px 10px; margin-left: 30px; }
.board-svg { display: block; width: 100%; height: 100%; }
.sq-l { fill: var(--sq-l); } .sq-d { fill: var(--sq-d); } .sq-last { fill: var(--last); } .sq-sel { fill: var(--sel); }
.coord { font: 700 17px var(--f); } .coord.on-l { fill: var(--sq-d); } .coord.on-d { fill: var(--sq-l); }
.arrow { opacity: .85; } .arrow.best { fill: #3fa34d; } .arrow.played { fill: #e2483a; }
.dot { fill: rgba(0, 0, 0, .18); } .dot-cap { fill: none; stroke: rgba(0, 0, 0, .18); stroke-width: 8; }
.mark-blunder { fill: rgba(250, 65, 45, .45); } .mark-mistake { fill: rgba(255, 164, 89, .5); } .mark-inaccuracy { fill: rgba(247, 198, 49, .45); }
.badge circle { stroke: #fff; stroke-width: 3; } .badge text { font: 900 22px var(--f); fill: #fff; }
.navbar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 2fr); gap: 6px; margin-left: 30px; }
.navbar button { border: 0; background: var(--gray-btn); box-shadow: 0 3px 0 var(--gray-sh); border-radius: 7px; height: 44px; cursor: pointer; font-size: 20px; font-weight: 800; color: var(--ink2); margin-bottom: 3px; }
.navbar button:disabled { opacity: .35; cursor: default; }
.navbar .errbtn { font-size: 14px; background: var(--k-blunder); color: #fff; box-shadow: 0 3px 0 #a3271a; }

.panel { background: var(--panel); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.coach { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: start; }
.avatar { width: 46px; height: 46px; border-radius: 10px; background: var(--raise); color: var(--ink); display: grid; place-items: center; }
.avatar svg { width: 34px; height: 34px; }
.bubble { background: #fff; color: #262522; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; position: relative; }
.bubble::before { content: ""; position: absolute; left: -7px; top: 16px; border: 7px solid transparent; border-left: 0; border-right-color: #fff; }
.b-title { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; line-height: 1.25; }
.b-text { margin: 0; font-size: 15px; line-height: 1.5; }
.b-q { background: #f1f0ee; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.b-q .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; color: #6e6c69; }
.b-q .v { font-weight: 700; }
.b-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.bubble .btn.secondary { background: #e7e6e4; color: #262522; box-shadow: 0 3px 0 #c6c4c1; }
.bubble .btn.ghost { color: #4a4845; border-color: #d4d2cf; }

.kicon { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 4px; border-radius: 99px; font-size: 13px; font-weight: 900; color: #fff; flex: 0 0 auto; letter-spacing: -.04em; }
.kicon.sm { min-width: 18px; height: 18px; font-size: 10.5px; padding: 0 3px; }
.k-best, .badge.k-best circle { background: var(--k-best); fill: var(--k-best); }
.k-excellent, .badge.k-excellent circle { background: var(--k-excellent); fill: var(--k-excellent); }
.k-good, .badge.k-good circle { background: var(--k-good); fill: var(--k-good); }
.k-book, .badge.k-book circle { background: var(--k-book); fill: var(--k-book); }
.k-forced, .badge.k-forced circle { background: var(--k-forced); fill: var(--k-forced); }
.k-inaccuracy, .badge.k-inaccuracy circle { background: var(--k-inaccuracy); fill: var(--k-inaccuracy); }
.k-mistake, .badge.k-mistake circle { background: var(--k-mistake); fill: var(--k-mistake); }
.k-miss, .badge.k-miss circle { background: var(--k-miss); fill: var(--k-miss); }
.k-blunder, .badge.k-blunder circle { background: var(--k-blunder); fill: var(--k-blunder); }
.gdot.k-blunder { fill: var(--k-blunder); } .gdot.k-mistake { fill: var(--k-mistake); } .gdot.k-miss { fill: var(--k-miss); }
.gdot { stroke: var(--panel); stroke-width: 2; vector-effect: non-scaling-stroke; }

.graph svg { display: block; width: 100%; height: 64px; border-radius: 6px; cursor: crosshair; }
.g-bg { fill: #403d39; } .g-me { fill: #fff; } .g-mid { stroke: #8b8987; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-dasharray: 4 4; }
.g-cur { stroke: var(--green); stroke-width: 3; vector-effect: non-scaling-stroke; }

.movelist { max-height: 300px; overflow-y: auto; background: var(--panel2); border-radius: 8px; font-family: var(--mono); font-size: 14px; position: relative; }
.mrow { display: grid; grid-template-columns: 42px minmax(0, 1fr) minmax(0, 1fr); align-items: center; }
.mrow:nth-child(even) { background: rgba(255, 255, 255, .025); }
.mno { color: var(--muted); padding-left: 10px; }
.mv { display: flex; align-items: center; gap: 6px; border: 0; background: transparent; text-align: left; padding: 5px 8px; cursor: pointer; font-family: inherit; font-size: inherit; color: var(--ink2); border-radius: 4px; }
.mv:hover { background: var(--raise); }
.mv.cur { background: var(--raise); color: var(--ink); font-weight: 800; box-shadow: inset 0 -2px 0 var(--green); }
.back-sum { align-self: flex-start; }

.variants { background: var(--panel2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.vtitle { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; font-weight: 800; color: var(--muted); }
.vsub { font-size: 12px; font-weight: 800; color: var(--muted); margin-top: 2px; }
.vline { display: flex; flex-direction: column; gap: 4px; border-left: 3px solid var(--line); padding-left: 8px; }
.vline.bad { border-left-color: var(--k-blunder); } .vline.good { border-left-color: var(--k-best); }
.vhead { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); font-weight: 700; }
.veval { font-family: var(--mono); font-size: 12px; font-weight: 800; background: #fff; color: #262522; border-radius: 4px; padding: 1px 6px; min-width: 44px; text-align: center; }
.veval:empty { display: none; }
.vmoves { display: flex; flex-wrap: wrap; gap: 2px 4px; font-family: var(--mono); font-size: 13.5px; align-items: center; }
.vnum { color: var(--muted); font-size: 12.5px; }
.vmv { border: 0; background: transparent; color: var(--ink); padding: 2px 5px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: inherit; }
.vmv:hover { background: var(--raise); }
.vwait { font-size: 13px; color: var(--muted); }
.movelist.explore { padding: 8px; }
.xhead { font-family: var(--f); font-size: 12px; color: var(--muted); font-weight: 700; padding: 0 2px 6px; }
.xmoves { display: flex; flex-wrap: wrap; gap: 2px; }

.b-sec { display: flex; flex-direction: column; gap: 4px; }
.b-sec + .b-sec { border-top: 1px solid #e4e3e1; padding-top: 8px; }
.b-who { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-weight: 800; color: #8a8885; }
.b-warn { background: #fff0ec; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.b-warn .b-who { color: #c8321f; }
.sq-hint { fill: rgba(93, 155, 214, .55); }
.navbar.play { grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.6fr); margin-left: 30px; }
.navbar.play button { font-size: 14px; }
.navbar .errbtn:disabled { background: var(--gray-btn); box-shadow: 0 3px 0 var(--gray-sh); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--panel2); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.tile.me { box-shadow: inset 0 0 0 2px var(--green); }
.tile-name { font-size: 13px; font-weight: 800; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tile-box { background: var(--raise); border-radius: 6px; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; }
.tile-n { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
.tile-l { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.tile-note { margin: -4px 0 0; font-size: 11.5px; color: var(--muted); }
.g-acc { background: var(--raise); color: var(--ink); border-radius: 5px; padding: 2px 6px; margin-right: 4px; }
.k-brilliant, .badge.k-brilliant circle { background: #1baca6; fill: #1baca6; }
.k-great, .badge.k-great circle { background: #5c8bb0; fill: #5c8bb0; }
.k-txt-brilliant { color: #1baca6; } .k-txt-great { color: #5c8bb0; }

.chart svg { display: block; width: 100%; height: auto; }
.chart-t { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 4px; }
.c-grid { stroke: var(--line); stroke-dasharray: 3 4; } .c-line { fill: none; stroke: var(--green); stroke-width: 3; stroke-linejoin: round; }
.c-dot { fill: var(--green); stroke: var(--panel); stroke-width: 2; } .c-lab { fill: var(--muted); font: 700 11px var(--f); } .c-last { fill: var(--ink); font: 800 13px var(--f); }
.rule { background: var(--panel2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.rule .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; color: var(--muted); }
.rule .v { font-weight: 700; }
.plan-item { background: var(--panel2); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.plan-head { display: flex; gap: 8px; align-items: center; font-weight: 800; }
.plan-check { width: 22px; height: 22px; border-radius: 99px; border: 2px solid var(--muted); display: grid; place-items: center; font-size: 13px; color: #fff; flex: 0 0 auto; }
.plan-item.done .plan-check { background: var(--green); border-color: var(--green); }
.plan-detail { margin: 0; color: var(--ink2); font-size: 14px; }
.plan-bar { width: 100%; height: 8px; background: var(--raise); border-radius: 99px; overflow: hidden; }
.plan-fill { height: 100%; background: var(--green); }
.plan-count { font-size: 12px; color: var(--muted); font-weight: 700; }
.tiles .tile { align-items: center; }
.tile-d { font-size: 12px; font-weight: 700; color: var(--muted); } .tile-d.up { color: var(--green); } .tile-d.down { color: var(--k-miss); }

.pelo { font-weight: 600; color: var(--muted); font-size: 13px; }
.b-sect { border-left: 3px solid #d9d7d4; padding: 2px 0 2px 10px; display: flex; flex-direction: column; gap: 1px; }
.b-sect .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; color: #8a8885; }
.b-sect .v { font-size: 14.5px; line-height: 1.45; }
.ktable { display: flex; flex-direction: column; background: var(--panel2); border-radius: 8px; padding: 6px 0; }
.krow { display: grid; grid-template-columns: minmax(0, 1fr) 64px 92px; align-items: center; padding: 5px 12px; font-size: 15px; }
.krow.hdr { font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
.kl { display: flex; align-items: center; gap: 8px; }
.kn { text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink2); }
.kn.me { color: var(--ink); }
.k-txt-blunder { color: var(--k-blunder); } .k-txt-mistake { color: var(--k-mistake); } .k-txt-inaccuracy { color: var(--k-inaccuracy); } .k-txt-miss { color: var(--k-miss); } .k-txt-best { color: var(--k-best); }
.sum-acts { display: flex; flex-direction: column; gap: 6px; }

/* Esercizi e gioco (stesse basi) */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chipbtn { border: 0; background: var(--panel2); color: var(--ink2); border-radius: 99px; padding: 7px 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.chipbtn.on { background: var(--green); color: #fff; }
.ex-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.ex-score { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ex-grid { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 18px; margin-top: 12px; align-items: start; }
.ex-boardcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ex-board { aspect-ratio: 1; max-width: 100%; border-radius: 4px; overflow: hidden; cursor: pointer; touch-action: manipulation; }
.ex-turn, .play-status { font-size: 14px; color: var(--ink2); }
.ex-side { min-width: 0; display: flex; flex-direction: column; gap: 12px; background: var(--panel); border-radius: 10px; padding: 14px; }
.ex-prompt { font-size: 19px; line-height: 1.3; margin: 0; text-wrap: balance; }
.ex-src { font-size: 13px; color: var(--muted); }
.fb { border-radius: 8px; padding: 10px 12px; font-size: 15px; background: var(--panel2); border-left: 4px solid var(--line); }
.fb.ok { border-left-color: var(--green); } .fb.ko { border-left-color: var(--k-blunder); } .fb.hint { border-left-color: var(--k-inaccuracy); } .fb.wait { color: var(--muted); }
.m-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.freebox { background: var(--panel2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.freebox .b-title { font-size: 15px; }
.f-text.strong { font-weight: 800; }
.ex-nav { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.play-setup { background: var(--panel); border-radius: 10px; padding: 18px; margin: 4px auto 0; display: flex; flex-direction: column; gap: 12px; max-width: 640px; }
.field-l { font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: 4px; }
.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.level { border: 2px solid transparent; background: var(--panel2); border-radius: 10px; padding: 12px 10px; display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; }
.level.on { border-color: var(--green); }
.lv-name { font-weight: 800; } .lv-elo { font-size: 13px; color: var(--muted); }
.toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink2); }
.feed { display: flex; flex-direction: column; gap: 10px; max-height: 480px; overflow-y: auto; }
.fitem { background: var(--panel2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid var(--line); }
.fitem.blunder { border-left-color: var(--k-blunder); } .fitem.mistake { border-left-color: var(--k-mistake); } .fitem.meh { border-left-color: var(--k-inaccuracy); } .fitem.good { border-left-color: var(--green); } .fitem.warn { border-left-color: var(--k-mistake); } .fitem.end { border-left-color: var(--ink2); }
.f-title { font-weight: 800; } .f-sub { font-weight: 700; color: var(--ink2); } .f-text { margin: 0; }
.m-best, .m-q { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.m-best .k, .m-q .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; color: var(--muted); }
.m-best .v { font-family: var(--mono); color: var(--green); font-weight: 800; }
.m-q { flex-direction: column; gap: 2px; background: var(--raise); border-radius: 6px; padding: 8px 10px; }
.m-q .v { font-weight: 700; }
.play-moves { font-family: var(--mono); font-size: 13px; color: var(--muted); line-height: 1.7; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* Progressi */
.callout h3 { margin: 0; font-size: 26px; color: var(--k-mistake); }
.callout p { margin: 0; color: var(--ink2); }
.bar-row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) 32px; gap: 10px; align-items: center; font-size: 14px; }
.bar-t { height: 10px; background: var(--panel2); border-radius: 99px; overflow: hidden; }
.bar-f { display: block; height: 100%; background: var(--k-mistake); border-radius: 99px; }
.bar-n { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
footer { margin-top: 30px; font-size: 12px; color: var(--muted); text-align: center; }

@media (max-width: 900px) {
  .rv-grid, .ex-grid { grid-template-columns: minmax(0, 1fr); }
  .movelist { max-height: 240px; }
}
@media (max-width: 560px) {
  .wrap { padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .tabs { width: 100%; }
  .tabs button { flex: 1; padding: 9px 4px; font-size: 13.5px; }
  .brand { font-size: 18px; }
  .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pbar, .navbar, .navbar.play, .boardnote { margin-left: 0; padding-left: 0; }
  .boardwrap { grid-template-columns: 12px minmax(0, 1fr); gap: 4px; }
  .evaltxt { display: none; }
  .bar-row { grid-template-columns: minmax(0, 120px) minmax(0, 1fr) 28px; }
  .krow { grid-template-columns: minmax(0, 1fr) 48px 84px; }
}
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .prog-fill, .evalbar .fill { transition: none; } }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 45 45" aria-hidden="true"><path d="M22 10c10.5 1 16.5 8 16 29H15c0-9 10-6.5 8-21" fill="currentColor"/><path d="M24 18c.38 2.91-5.55 7.37-8 9-3 2-2.82 4.34-5 4-1.04-.94 1.41-3.04 0-3-1 0 .19 1.23-1 2-1 0-4 1-4-4 0-2 6-12 6-12s1.89-1.9 2-3.5c-.73-1-.5-2-.5-3 1-1 3 2.5 3 2.5h2s.78-1.99 2.5-3c1 0 1 3 1 3" fill="currentColor"/></svg>Moviola</div>
    <nav class="tabs" aria-label="Sezioni">
      <button type="button" id="tab-game" aria-selected="true">Partite</button>
      <button type="button" id="tab-ex" aria-selected="false">Esercizi</button>
      <button type="button" id="tab-play" aria-selected="false">Gioca</button>
      <button type="button" id="tab-stats" aria-selected="false">Progressi</button>
    </nav>
  </header>

  <section id="view-game">
    <div id="home" class="home-grid">
      <div class="userbar">
        <div class="field"><label for="user">Il tuo nome su chess.com</label><input id="user" autocomplete="off" spellcheck="false" placeholder="Il tuo username"></div>
        <button type="button" class="btn" id="fetch">Aggiorna</button>
      </div>
      <div class="progress" id="progress" hidden>
        <span id="prog-text"></span>
        <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
        <button type="button" class="btn small ghost" id="stop">Interrompi</button>
      </div>
      <p class="err" id="err" hidden></p>
      <div id="games"></div>
      <details class="more" id="more">
        <summary>Altri modi: incolla una partita o carica un file</summary>
        <div class="more-body">
          <div class="field"><label for="pgn">PGN della partita (su chess.com: Condividi, poi PGN, poi Copia)</label>
            <textarea id="pgn" spellcheck="false" placeholder="[Event &quot;Live Chess&quot;]&#10;…&#10;1. e4 e5 2. Cf3 …"></textarea></div>
          <div class="sidepick" id="sidepick" hidden>
            <label><input type="radio" name="side" id="side-w" checked> Ho il Bianco</label>
            <label><input type="radio" name="side" id="side-b"> Ho il Nero</label>
          </div>
          <div class="row">
            <button type="button" class="btn" id="go">Analizza</button>
            <label class="btn ghost filebtn" for="file">Carica un file .pgn<input type="file" id="file" accept=".pgn,.txt,text/plain"></label>
            <button type="button" class="btn ghost" id="demo">Partita d’esempio</button>
          </div>
          <div class="field"><label for="speed">Profondità dell’analisi</label>
            <select id="speed">
              <option value="veloce">Veloce (circa 30 secondi a partita)</option>
              <option value="normale">Normale (circa 1 minuto)</option>
              <option value="accurata">Accurata (qualche minuto)</option>
            </select></div>
        </div>
      </details>
    </div>

    <div id="review" hidden>
      <div class="rv-top">
        <button type="button" class="backbtn" id="back" aria-label="Torna alle partite">‹</button>
        <div><div class="rv-title" id="rv-title"></div><div class="rv-sub" id="rv-sub"></div></div>
      </div>
      <p class="demo-note" id="demo-note" hidden>Partita d’esempio: la “Partita all’Opera” di Parigi, 1858. Sei il Nero e rivedi i suoi errori.</p>
      <div class="rv-grid">
        <div class="boardcol">
          <div class="pbar" id="pb-top"></div>
          <div class="boardwrap">
            <div class="evalbar" aria-hidden="true"><div class="fill" id="evalfill"></div><span class="evaltxt" id="evaltxt"></span></div>
            <div class="board" id="board"></div>
          </div>
          <div class="pbar" id="pb-bot"></div>
          <div class="boardnote" id="boardnote" hidden></div>
          <div class="navbar">
            <button type="button" id="nav-first" aria-label="Inizio">«</button>
            <button type="button" id="nav-prev" aria-label="Mossa precedente">‹</button>
            <button type="button" id="nav-next" aria-label="Mossa successiva">›</button>
            <button type="button" id="nav-last" aria-label="Fine">»</button>
            <button type="button" id="nav-err" class="errbtn">Prossimo errore</button>
          </div>
        </div>
        <div class="panel" id="panel"></div>
      </div>
    </div>
  </section>

  <section id="view-ex" hidden><div id="ex-body"></div></section>
  <section id="view-play" hidden><div id="play-body"></div></section>
  <section id="view-stats" hidden><div id="stats-body" class="home-grid"></div></section>

  <footer>Analisi di Stockfish 17.1, direttamente sul tuo dispositivo. Nome e partite restano salvati solo in questo browser.</footer>
</div>
